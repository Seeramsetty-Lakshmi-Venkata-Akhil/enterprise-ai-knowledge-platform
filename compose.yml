services:
  postgres:
    image: postgres:17
    container_name: enterprise_ai_postgres
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d enterprise_ai" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
