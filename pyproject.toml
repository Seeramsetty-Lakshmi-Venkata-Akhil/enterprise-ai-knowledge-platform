[project]
name = "enterprise-ai-knowledge-platform"
version = "0.1.0"
description = "Production-grade enterprise AI knowledge platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=9.0,<10.0", "ruff>=0.12,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
